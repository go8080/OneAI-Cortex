[project]
name = "oneai-cortex"
version = "0.1.0"
description = "Open-source AI agent builder platform — build, test, evaluate, and deploy agents"
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    # Encryption
    "cryptography>=44.0.0",
    # Agent framework (DeepAgents + LangChain ecosystem)
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    # MCP
    "mcp>=1.0.0",
    # Checkpointing
    "aiosqlite>=0.21.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # Cache
    "redis>=5.2.0",
    # Observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",
    # Utilities
    "packaging>=24.0",
    "langchain>=1.2.15",
    "deepagents>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
# DeepAgents SDK — install from local source during development:
#   uv add deepagents --path /path/to/deepagents/libs/deepagents
# Or from git:
#   uv add deepagents --git https://github.com/langchain-ai/deepagents

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
